<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食堂饭菜记录本</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <header class="header">
      <h1>🍱 食堂饭菜记录本</h1>
      <div class="nav-actions">
        <button id="addCanteenBtn" class="btn btn-secondary">+ 新建食堂</button>
        <button id="addRecordBtn" class="btn btn-primary">+ 新建记录</button>
      </div>
    </header>

    <!-- 面包屑导航 -->
    <nav class="breadcrumb" id="breadcrumb">
      <span class="crumb crumb-root" data-level="root">全部食堂</span>
    </nav>

    <!-- 主内容区 -->
    <main class="main" id="mainContent">
      <!-- 食堂列表视图 -->
      <section id="canteenView" class="view active">
        <div class="grid" id="canteenGrid"></div>
        <div id="canteenEmpty" class="empty-state hidden">
          <p>还没有食堂，点击右上角「新建食堂」开始记录吧！</p>
        </div>
      </section>

      <!-- 楼层列表视图 -->
      <section id="floorView" class="view">
        <div class="grid" id="floorGrid"></div>
      </section>

      <!-- 窗口列表视图 -->
      <section id="windowView" class="view">
        <div class="grid" id="windowGrid"></div>
      </section>

      <!-- 饭菜记录列表视图 -->
      <section id="recordView" class="view">
        <div class="record-header">
          <h2 id="recordTitle">窗口饭菜记录</h2>
          <button id="addRecordAtWindowBtn" class="btn btn-primary">+ 添加饭菜记录</button>
        </div>
        <div class="record-list" id="recordList"></div>
        <div id="recordEmpty" class="empty-state hidden">
          <p>还没有饭菜记录，点击「添加饭菜记录」开始吧！</p>
        </div>
      </section>
    </main>
  </div>

  <!-- 新建食堂弹窗 -->
  <div id="canteenModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新建食堂</h3>
        <button class="modal-close" data-close="canteenModal">&times;</button>
      </div>
      <form id="canteenForm" class="modal-body">
        <div class="form-group">
          <label>食堂名称 <span class="required">*</span></label>
          <input type="text" id="canteenName" required placeholder="如：第一食堂" />
        </div>
        <div class="form-group">
          <label>楼层数 <span class="required">*</span></label>
          <input type="number" id="canteenFloors" min="1" max="20" value="1" required />
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="canteenNote" rows="2" placeholder="可选：位置、营业时间等"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close="canteenModal">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新建楼层/窗口弹窗 -->
  <div id="addItemModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="addItemTitle">新建</h3>
        <button class="modal-close" data-close="addItemModal">&times;</button>
      </div>
      <form id="addItemForm" class="modal-body">
        <div class="form-group">
          <label id="addItemLabel">名称 <span class="required">*</span></label>
          <input type="text" id="addItemName" required placeholder="请输入名称" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close="addItemModal">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新建饭菜记录弹窗 -->
  <div id="recordModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新建饭菜记录</h3>
        <button class="modal-close" data-close="recordModal">&times;</button>
      </div>
      <form id="recordForm" class="modal-body">
        <!-- 快捷选择层级（当未在窗口视图时显示） -->
        <div id="recordHierarchy" class="hierarchy-select hidden">
          <div class="form-group">
            <label>选择食堂 <span class="required">*</span></label>
            <select id="recordCanteenSelect"></select>
          </div>
          <div class="form-group">
            <label>选择楼层 <span class="required">*</span></label>
            <select id="recordFloorSelect"></select>
          </div>
          <div class="form-group">
            <label>选择窗口 <span class="required">*</span></label>
            <select id="recordWindowSelect"></select>
          </div>
        </div>

        <div class="form-group">
          <label>饭菜名称 <span class="required">*</span></label>
          <input type="text" id="recordDishName" required placeholder="如：红烧牛肉面" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>日期 <span class="required">*</span></label>
            <input type="date" id="recordDate" required />
          </div>
          <div class="form-group">
            <label>价格（元）</label>
            <input type="number" id="recordPrice" min="0" step="0.01" placeholder="如：12.5" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>评分</label>
            <div class="star-rating" id="starRating">
              <span data-value="5">★</span>
              <span data-value="4">★</span>
              <span data-value="3">★</span>
              <span data-value="2">★</span>
              <span data-value="1">★</span>
            </div>
            <input type="hidden" id="recordRating" value="0" />
          </div>
        </div>

        <div class="form-group">
          <label>上传图片</label>
          <div class="image-upload">
            <input type="file" id="recordImage" accept="image/*" multiple />
            <div class="image-preview" id="imagePreview"></div>
          </div>
        </div>

        <div class="form-group">
          <label>文字评价</label>
          <textarea id="recordReview" rows="4" placeholder="说说味道、分量、排队情况等..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close="recordModal">取消</button>
          <button type="submit" class="btn btn-primary">保存记录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 饭菜记录详情弹窗 -->
  <div id="recordDetailModal" class="modal hidden">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="detailTitle">饭菜详情</h3>
        <button class="modal-close" data-close="recordDetailModal">&times;</button>
      </div>
      <div class="modal-body" id="recordDetailBody"></div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button class="modal-close" data-close="confirmModal">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">确定要删除吗？此操作不可撤销。</p>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close="confirmModal">取消</button>
          <button type="button" id="confirmDeleteBtn" class="btn btn-danger">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
